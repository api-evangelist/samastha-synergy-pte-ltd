aid: samastha-synergy-pte-ltd
name: Samastha Synergy Pte. Ltd.
description: >-
  Samastha Synergy Pte. Ltd. operates Djoin (djoin.id), positioning itself as a
  "digital partner for sustainable scale" that helps financial institutions and
  organizations in Indonesia grow through an adaptive product ecosystem. Djoin's
  named products are Coopmax (a platform aimed at cooperatives / koperasi),
  Kocek, and ProofyLink. The company runs a private backend API at api.djoin.id,
  which sits behind Cloudflare and returns 403 to unauthenticated requests; as of
  this profile there is no public developer portal, OpenAPI/Swagger definition,
  documentation, or SDK surface published. Samastha Synergy was surfaced as a
  portfolio company of 500 Global and added to the API Evangelist network for
  enrichment; this profile captures what is publicly verifiable from the djoin.id
  site and DNS/TLS probes.
